# prometheus.yml - Cấu hình thu thập số liệu hiệu năng mạng AWS Cloud-Native
global:
  scrape_interval: 2s     # Chu kỳ lấy mẫu 2 giây theo dõi diễn biến thông lượng và tải CPU
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Thu thập số liệu hiệu năng mạng (RTT, Placement Group, SoftIRQ %, PPS)
  # Một target duy nhất tránh duplicate series với cùng bộ label nghiên cứu.
  - job_name: 'network_performance_exporter'
    static_configs:
      - targets: ['mock-metrics-exporter:9100']
