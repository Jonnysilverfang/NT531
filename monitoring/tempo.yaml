server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
ingester:
  trace_idle_period: 10s
  max_block_duration: 5m
compactor:
  compaction:
    # Preserve the October 12 smoke timestamps through the October 26 seminar.
    # Local demo data only; replay never re-dates the original AWS spans.
    block_retention: 720h
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
